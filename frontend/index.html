    <script>
      // set the saved theme before first paint so dark mode never flashes light
      try {
        var t = localStorage.getItem("soc-console-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
