services:
  - type: web
    name: xai-soc-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: OPEN_ACCESS
        value: "true"   # no login screen; every visitor acts as admin
      - key: ADMIN_PASSWORD
        sync: false   # Render asks for this on first deploy
      - key: CORS_ORIGINS
        sync: false   # e.g. https://<your-github-username>.github.io
