services:
  - type: web
    name: xai-soc-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: OPEN_ACCESS
        value: "true"   # no login screen; every visitor acts as admin
      - key: ADMIN_PASSWORD
        generateValue: true   # unused while OPEN_ACCESS is on
      - key: CORS_ORIGINS
        value: https://riyan-hx.github.io
